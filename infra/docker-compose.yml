services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      AGENT_MODE: mock
    volumes:
      - crm-data:/app/data/runtime
    ports:
      - "127.0.0.1:${SHELFPILOT_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  crm-data:
