openapi: 3.1.0
info:
  title: ShelfPilot Sales Agent
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      description: Process liveness and configured mode. Does not contact providers.
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/voice/transcribe:
    post:
      tags:
      - voice
      summary: Transcribe Audio
      operationId: transcribe_audio_api_voice_transcribe_post
      requestBody:
        content:
          audio/wav:
            schema:
              type: string
              format: binary
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
  /api/voice/speak:
    post:
      tags:
      - voice
      summary: Speak Sentence
      operationId: speak_sentence_api_voice_speak_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            audio/mpeg: {}
            audio/wav: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        status:
          type: string
          const: ok
          title: Status
        mode:
          type: string
          enum:
          - mock
          - live
          title: Mode
      type: object
      required:
      - status
      - mode
      title: Health
    SpeechRequest:
      properties:
        text:
          type: string
          maxLength: 500
          minLength: 1
          title: Text
      type: object
      required:
      - text
      title: SpeechRequest
    Transcript:
      properties:
        text:
          type: string
          title: Text
        provider:
          type: string
          title: Provider
        latency_ms:
          type: number
          title: Latency Ms
      type: object
      required:
      - text
      - provider
      - latency_ms
      title: Transcript
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
